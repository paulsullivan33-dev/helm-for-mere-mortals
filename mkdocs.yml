site_name: Helm for Mere Mortals
site_description: The package manager for Kubernetes. Writing charts that bundle an application's manifests, shaping them with values, rendering and linting them on your own machine, packaging and sharing them through repositories, and what install, upgrade and rollback do on a real cluster, with the limits stated plainly.
